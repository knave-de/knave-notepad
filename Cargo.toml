[package]
name = "knave-notepad"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Notes — an autosaving, tabbed notebook for Knave"
repository = "https://github.com/knave-de/knave-notepad"

[dependencies]
knave-ui = { git = "https://github.com/knave-de/knave-ui", rev = "77bb28aab7bb07eae0a01a1611b6c89c2f51ad07" }
knave-renderer = { git = "https://github.com/knave-de/knave-ui", rev = "77bb28aab7bb07eae0a01a1611b6c89c2f51ad07" }
wgpu = "30.0.1"
pollster = "1.0.1"
winit = "0.30.13"
arboard = { version = "3.6", default-features = false }
smithay-clipboard = "0.7"
rustix = { version = "1", features = ["fs", "event"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
fs2 = "0.4"
uuid = { version = "1", features = ["v4"] }
modalkit = "0.0.32"
crossterm = "0.29"
unicode-segmentation = "1"
unicode-width = "0.2"
png = "0.18"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

[dev-dependencies]
tempfile = "3"
